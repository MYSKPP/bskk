<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #1e293b;
    }

    .top-header {
      background: #102447;
      color: white;
      padding: 25px 20px;
    }

    .header-inner {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      height: 66px;
      width: auto;
      max-width: 90px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 22px;
      margin: 0 0 7px;
      letter-spacing: .5px;
    }

    .brand p {
      margin: 0;
      font-size: 11px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .header-label {
      font-size: 11px;
      color: #dbeafe;
      border: 1px solid #64748b;
      padding: 9px 13px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .header-label {
      text-align: center;
    }

    .clock-date {
      font-size: 11px;
      color: #dbeafe;
      margin-bottom: 4px;
    }

    .clock-time {
      font-size: 20px;
      font-weight: bold;
      color: white;
      letter-spacing: 1.5px;
      font-variant-numeric: tabular-nums;
    }

    .nav-bar {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-inner {
      max-width: 1150px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 22px;
      min-height: 48px;
      overflow-x: auto;
    }

    .nav-item {
      border: 0;
      background: none;
      color: #334155;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      padding: 16px 0;
      white-space: nowrap;
    }

    .nav-item.active,
    .nav-item:hover {
      color: #1d4ed8;
      border-bottom: 3px solid #1d4ed8;
    }

    .container {
      max-width: 1150px;
      margin: 28px auto;
      padding: 0 20px;
      min-height: 55vh;
    }

    .hero {
      background: linear-gradient(120deg, #142e55, #2563a6);
      color: white;
      padding: 38px;
      border-radius: 12px;
      margin-bottom: 28px;
    }

    .hero small {
      color: #bfdbfe;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .hero h2 {
      font-size: 28px;
      margin: 12px 0;
    }

    .hero p {
      font-size: 13px;
      line-height: 1.8;
      color: #dbeafe;
      max-width: 650px;
      margin: 0;
    }

    /* ===== SLIDER LAMAN UTAMA ===== */
    .hero-slider {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 28px;
      background: linear-gradient(120deg, #142e55, #2563a6);
      color: white;
    }

    .hero-track {
      display: flex;
      transition: transform .7s ease;
    }

    .hero-slide {
      position: relative;
      min-width: 100%;
      min-height: 270px;
      padding: 38px 75px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(16,36,71,.93), rgba(16,36,71,.5));
    }

    .hero-slide small,
    .hero-slide h2,
    .hero-slide p,
    .hero-btn {
      position: relative;
      z-index: 1;
    }

    .hero-slide small {
      color: #bfdbfe;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .hero-slide h2 {
      font-size: 28px;
      line-height: 1.4;
      margin: 12px 0;
    }

    .hero-slide p {
      font-size: 13px;
      line-height: 1.8;
      color: #dbeafe;
      max-width: 650px;
      margin: 0;
    }

    .hero-btn {
      align-self: flex-start;
      margin-top: 18px;
      background: white;
      color: #102447;
      border: 0;
      padding: 10px 16px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .hero-arrow:hover {
      background: rgba(255,255,255,.35);
    }

    .hero-arrow.prev { left: 15px; }
    .hero-arrow.next { right: 15px; }

    .hero-dots {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .hero-dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      cursor: pointer;
    }

    .hero-dot.active {
      background: white;
      width: 24px;
      border-radius: 5px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 25px 0 17px;
    }

    .section-heading h2 {
      font-size: 19px;
      margin: 0;
      color: #102447;
    }

    .search-box {
      width: 270px;
      max-width: 100%;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      font-size: 12px;
    }

    .search-box:focus {
      border-color: #2563eb;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .category-btn {
      border: 1px solid #cbd5e1;
      background: white;
      color: #475569;
      padding: 8px 13px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 11px;
    }

    .category-btn.active,
    .category-btn:hover {
      background: #102447;
      border-color: #102447;
      color: white;
    }

    .post-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .post-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      overflow: hidden;
      cursor: pointer;
      transition: .2s;
    }

    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(15,23,42,.09);
    }

    .post-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
    }

    .post-no-image {
      height: 190px;
      background: linear-gradient(135deg, #dbeafe, #94a3b8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #102447;
      font-size: 35px;
    }

    .post-content {
      padding: 17px;
    }

    .post-category {
      color: #2563eb;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .post-content h3 {
      font-size: 16px;
      line-height: 1.5;
      margin: 9px 0;
      color: #102447;
    }

    .post-content p {
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
      margin: 0 0 15px;
    }

    .post-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      color: #94a3b8;
      font-size: 10px;
    }

    .read-more {
      color: #1d4ed8;
      font-size: 11px;
      font-weight: bold;
      margin-top: 13px;
    }

    /* ===== KAD SAMA TINGGI & SAMA LEVEL ===== */
    .post-grid {
      align-items: stretch;
    }

    .post-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .post-image,
    .post-no-image {
      flex-shrink: 0;
    }

    .post-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .post-content h3 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1.5em * 2);
    }

    .post-content p {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1.7em * 3);
    }

    .post-meta {
      margin-top: auto;
    }

    /* ===== PAGINATION ===== */
    .section-heading {
      scroll-margin-top: 60px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 30px;
    }

    .page-btn {
      min-width: 38px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      padding: 9px 13px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .page-btn:hover:not(:disabled) {
      background: #eaf0f8;
    }

    .page-btn.active {
      background: #102447;
      border-color: #102447;
      color: white;
    }

    .page-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .page-gap {
      color: #94a3b8;
      padding: 0 2px;
    }

    .vote-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .vote-btn {
      border: 1px solid #cbd5e1;
      background: white;
      color: #475569;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .vote-btn:hover {
      background: #f1f5f9;
    }

    .vote-btn.active.like {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }

    .vote-btn.active.dislike {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }

    .empty-state {
      background: white;
      padding: 45px 20px;
      text-align: center;
      border-radius: 9px;
      color: #64748b;
      font-size: 13px;
      grid-column: 1 / -1;
    }

    .article-page {
      background: white;
      padding: 30px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .back-btn {
      background: #eaf0f8;
      color: #102447;
      border: 0;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .article-category {
      color: #2563eb;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .article-title {
      color: #102447;
      font-size: 30px;
      line-height: 1.4;
      margin: 12px 0;
    }

    .article-meta {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 22px;
    }

    .article-image {
      width: 100%;
      max-height: 470px;
      object-fit: contain;
      background: #f1f5f9;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .article-body {
      font-size: 14px;
      line-height: 1.9;
      color: #334155;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* ===== RUANG KOMEN ===== */
    .comment-section {
      margin-top: 40px;
      border-top: 1px solid #e5e7eb;
      padding-top: 25px;
    }

    .comment-section h3 {
      color: #102447;
      font-size: 18px;
      margin: 0 0 15px;
    }

    .comment-form {
      display: grid;
      gap: 10px;
      margin-bottom: 25px;
    }

    .comment-form input,
    .comment-form textarea {
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      border-color: #2563eb;
    }

    .comment-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .comment-submit {
      background: #102447;
      color: white;
      border: 0;
      padding: 11px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      justify-self: start;
    }

    .comment-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .comment-msg {
      font-size: 12px;
      color: #16a34a;
    }

    .comment-msg.error {
      color: #dc2626;
    }

    .comment-item {
      background: #f8fafc;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .comment-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .comment-head strong {
      color: #102447;
    }

    .comment-head span {
      color: #94a3b8;
      font-size: 11px;
    }

    .comment-text {
      font-size: 13px;
      line-height: 1.7;
      color: #334155;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .honeypot {
      position: absolute;
      left: -9999px;
    }

    .loading {
      text-align: center;
      padding: 60px 15px;
      color: #64748b;
      font-size: 13px;
    }

    .footer {
      margin-top: 50px;
      background: #102447;
      color: #cbd5e1;
      text-align: center;
      padding: 25px 15px;
      font-size: 11px;
      line-height: 1.8;
    }

    .footer strong {
      color: white;
    }

    @media(max-width:850px) {
      .post-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media(max-width:600px) {
      .header-inner {
        display: block;
      }

      .header-label {
        display: inline-block;
        margin-top: 15px;
      }

      .brand h1 {
        font-size: 18px;
      }

      .brand-logo {
        height: 48px;
        max-width: 60px;
      }

      .hero {
        padding: 25px 20px;
      }

      .hero h2 {
        font-size: 22px;
      }

      .hero-slide {
        padding: 25px 20px 48px;
        min-height: 300px;
      }

      .hero-slide h2 {
        font-size: 20px;
      }

      .hero-arrow {
        display: none;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .search-box {
        width: 100%;
      }

      .post-grid {
        grid-template-columns: 1fr;
      }

      .post-image,
      .post-no-image {
        height: 200px;
      }

      .article-page {
        padding: 20px 15px;
      }

      .article-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header class="top-header">
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo"
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Jata_MalaysiaV2.svg?width=300"
          alt="Jata Negara Malaysia"
          onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>PORTAL UNIT KESENIAN BSKK</h1>
          <p>BAHAGIAN SUKAN, KOKURIKULUM DAN KESENIAN</p>
          <p>KEMENTERIAN PENDIDIKAN MALAYSIA</p>
        </div>
      </div>
      <div class="header-label">
        <div class="clock-date" id="clockDate">&nbsp;</div>
        <div class="clock-time" id="clockTime">--:--:--</div>
      </div>
    </div>
  </header>

  <nav class="nav-bar">
    <div class="nav-inner">
      <button class="nav-item active" onclick="showHome()">LAMAN UTAMA</button>
      <button class="nav-item" onclick="showHome()">ARTIKEL</button>
    </div>
  </nav>

  <main class="container">
    <div id="mainContent">
      <div class="loading">Sedang memuatkan portal...</div>
    </div>
  </main>

  <footer class="footer">
    <strong>PORTAL UNIT KESENIAN BSKK</strong><br>
    BAHAGIAN SUKAN, KOKURIKULUM DAN KESENIAN<br>
    KEMENTERIAN PENDIDIKAN MALAYSIA
  </footer>

  <script>
    let portalData = {
      artikel: [],
      kategori: []
    };

    let activeCategory = '';
    let currentView = 'home';

    const POST_PER_PAGE = 6; // bilangan artikel setiap halaman
    let currentPage = 1;

    window.addEventListener('load', loadPortal);

    /* ===== JAM & TARIKH REALTIME (WAKTU MALAYSIA, UTC+8) ===== */
    const NAMA_HARI = [
      'Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'
    ];

    const NAMA_BULAN = [
      'Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun',
      'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'
    ];

    function kemasKiniJam() {
      const dateEl = document.getElementById('clockDate');
      const timeEl = document.getElementById('clockTime');
      if (!dateEl || !timeEl) return;

      // Malaysia UTC+8 tanpa waktu jimat siang
      const kl = new Date(Date.now() + 8 * 60 * 60 * 1000);

      const dua = function(n) { return String(n).padStart(2, '0'); };

      dateEl.textContent =
        NAMA_HARI[kl.getUTCDay()] + ', ' +
        kl.getUTCDate() + ' ' +
        NAMA_BULAN[kl.getUTCMonth()] + ' ' +
        kl.getUTCFullYear();

      timeEl.textContent =
        dua(kl.getUTCHours()) + ':' +
        dua(kl.getUTCMinutes()) + ':' +
        dua(kl.getUTCSeconds());
    }

    kemasKiniJam();
    setInterval(kemasKiniJam, 1000);

    function loadPortal() {
      google.script.run
        .withSuccessHandler(function(data) {
          portalData = data || { artikel: [], kategori: [] };
          renderHome();
        })
        .withFailureHandler(function(error) {
          document.getElementById('mainContent').innerHTML =
            '<div class="empty-state">Gagal memuatkan portal: ' +
            escapeHtml(error.message || String(error)) +
            '</div>';
        })
        .getPublicPortalData();
    }

    function renderHome() {
      currentView = 'home';

      const categories = portalData.kategori || [];

      let categoryHtml = `
        <button class="category-btn active"
          onclick="filterCategory('')">SEMUA</button>
      `;

      categories.forEach(function(category) {
        categoryHtml += `
          <button class="category-btn"
            onclick="filterCategory('${escapeAttr(category.id)}')">
            ${escapeHtml(category.nama)}
          </button>
        `;
      });

      document.getElementById('mainContent').innerHTML = `
        ${buildHero()}

        <div class="section-heading">
          <h2>ARTIKEL TERKINI</h2>
          <input class="search-box" id="searchInput"
            type="search" placeholder="Cari artikel..."
            oninput="cariArtikel()">
        </div>

        <div class="category-list" id="categoryList">
          ${categoryHtml}
        </div>

        <div class="post-grid" id="postGrid"></div>
        <div class="pagination" id="pagination"></div>
      `;

      renderPosts();
      initHero();
    }

    /* ===== SLIDER AUTOMATIK ===== */
    const HERO_MASA = 6000; // 6 saat setiap slide
    let heroIndex = 0;
    let heroCount = 0;
    let heroTimer = null;

    function buildHero() {
      const posts = (portalData.artikel || []).slice(0, 3);

      let slides = `
        <div class="hero-slide">
          <small>BAHAGIAN SUKAN, KOKURIKULUM DAN KESENIAN</small>
          <h2>Selamat Datang ke Portal Unit Kesenian BSKK</h2>
          <p>
            Pusat informasi, hebahan, dokumentasi dan perkongsian
            aktiviti berkaitan bidang kesenian Kementerian Pendidikan Malaysia.
          </p>
        </div>
      `;

      posts.forEach(function(post) {
        const ringkas = String(post.ringkasan || '');
        const teks = ringkas.length > 150
          ? ringkas.substring(0, 150) + '...'
          : ringkas;

        const img = post.imej
          ? `<img class="hero-bg" src="${escapeAttr(post.imej)}"
               alt="" onerror="this.style.display='none'">`
          : '';

        slides += `
          <div class="hero-slide">
            ${img}
            <div class="hero-overlay"></div>
            <small>${escapeHtml(post.kategori)}</small>
            <h2>${escapeHtml(post.tajuk)}</h2>
            <p>${escapeHtml(teks)}</p>
            <button class="hero-btn"
              onclick="openPost('${escapeAttr(post.slug)}')">
              BACA ARTIKEL →
            </button>
          </div>
        `;
      });

      const total = 1 + posts.length;
      let nav = '';

      if (total > 1) {
        let dots = '';
        for (let i = 0; i < total; i++) {
          dots += `<button class="hero-dot${i === 0 ? ' active' : ''}"
            aria-label="Slide ${i + 1}"
            onclick="heroGo(${i}); heroStart();"></button>`;
        }

        nav = `
          <button class="hero-arrow prev" aria-label="Sebelum"
            onclick="heroGo(heroIndex - 1); heroStart();">&#10094;</button>
          <button class="hero-arrow next" aria-label="Seterusnya"
            onclick="heroGo(heroIndex + 1); heroStart();">&#10095;</button>
          <div class="hero-dots">${dots}</div>
        `;
      }

      return `
        <section class="hero-slider" id="heroSlider"
          onmouseenter="heroStop()" onmouseleave="heroStart()">
          <div class="hero-track" id="heroTrack">${slides}</div>
          ${nav}
        </section>
      `;
    }

    function heroGo(i) {
      const track = document.getElementById('heroTrack');
      if (!track || !heroCount) return;

      heroIndex = (i + heroCount) % heroCount;
      track.style.transform = 'translateX(-' + (heroIndex * 100) + '%)';

      document.querySelectorAll('.hero-dot').forEach(function(dot, n) {
        dot.classList.toggle('active', n === heroIndex);
      });
    }

    function heroStop() {
      if (heroTimer) {
        clearInterval(heroTimer);
        heroTimer = null;
      }
    }

    function heroStart() {
      heroStop();

      const kurangGerak = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (heroCount < 2 || kurangGerak) return;

      heroTimer = setInterval(function() {
        // berhenti sendiri jika pengguna sudah keluar dari laman utama
        if (!document.getElementById('heroTrack')) {
          heroStop();
          return;
        }
        heroGo(heroIndex + 1);
      }, HERO_MASA);
    }

    function initHero() {
      heroIndex = 0;
      heroCount = document.querySelectorAll('.hero-slide').length;
      heroStart();

      // swipe pada telefon
      const slider = document.getElementById('heroSlider');
      if (!slider) return;

      let startX = 0;

      slider.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        heroStop();
      }, { passive: true });

      slider.addEventListener('touchend', function(e) {
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) heroGo(heroIndex + (dx < 0 ? 1 : -1));
        heroStart();
      }, { passive: true });
    }

    function renderPosts() {
      const grid = document.getElementById('postGrid');
      if (!grid) return;

      const search = (
        document.getElementById('searchInput')?.value || ''
      ).toLowerCase().trim();

      const posts = (portalData.artikel || []).filter(function(post) {
        const matchCategory =
          !activeCategory || post.kategoriId === activeCategory;

        const matchSearch =
          !search ||
          post.tajuk.toLowerCase().includes(search) ||
          post.ringkasan.toLowerCase().includes(search) ||
          post.kategori.toLowerCase().includes(search);

        return matchCategory && matchSearch;
      });

      if (!posts.length) {
        grid.innerHTML = `
          <div class="empty-state">
            Tiada artikel dijumpai.
          </div>
        `;
        renderPagination(0);
        return;
      }

      const totalPages = Math.max(1, Math.ceil(posts.length / POST_PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const mula = (currentPage - 1) * POST_PER_PAGE;
      const pagePosts = posts.slice(mula, mula + POST_PER_PAGE);

      grid.innerHTML = pagePosts.map(function(post) {
        const image = post.imej
          ? `<img class="post-image"
               src="${escapeAttr(post.imej)}"
               alt="${escapeAttr(post.tajuk)}"
               onerror="this.style.visibility='hidden'">`
          : `<div class="post-no-image">✦</div>`;

        return `
          <article class="post-card"
            onclick="openPost('${escapeAttr(post.slug)}')">
            ${image}
            <div class="post-content">
              <div class="post-category">
                ${escapeHtml(post.kategori)}
              </div>
              <h3>${escapeHtml(post.tajuk)}</h3>
              <p>${escapeHtml(post.ringkasan || 'Klik untuk membaca artikel ini.')}</p>
              <div class="post-meta">
                <span>${escapeHtml(post.tarikh)}</span>
                <span>💬 ${Number(post.komen || 0)} komen</span>
              </div>
              <div class="vote-row">
                <button class="vote-btn like ${getMyVote(post.id) === 'like' ? 'active' : ''}"
                  id="vb-like-${escapeAttr(post.id)}"
                  onclick="vote(event, '${escapeAttr(post.id)}', 'like')">
                  👍 <span id="lk-${escapeAttr(post.id)}">${Number(post.like || 0)}</span>
                </button>
                <button class="vote-btn dislike ${getMyVote(post.id) === 'dislike' ? 'active' : ''}"
                  id="vb-dislike-${escapeAttr(post.id)}"
                  onclick="vote(event, '${escapeAttr(post.id)}', 'dislike')">
                  👎 <span id="dl-${escapeAttr(post.id)}">${Number(post.dislike || 0)}</span>
                </button>
              </div>
              <div class="read-more">BACA SELANJUTNYA →</div>
            </div>
          </article>
        `;
      }).join('');

      renderPagination(totalPages);
      updateCategoryButtons();
    }

    function renderPagination(totalPages) {
      const box = document.getElementById('pagination');
      if (!box) return;

      if (totalPages <= 1) {
        box.innerHTML = '';
        return;
      }

      const pages = [];

      for (let i = 1; i <= totalPages; i++) {
        if (
          totalPages <= 7 ||
          i === 1 ||
          i === totalPages ||
          Math.abs(i - currentPage) <= 1
        ) {
          pages.push(i);
        } else if (pages[pages.length - 1] !== '...') {
          pages.push('...');
        }
      }

      let html = `
        <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''}
          onclick="goPage(${currentPage - 1})">&lsaquo; Sebelum</button>
      `;

      pages.forEach(function(p) {
        html += p === '...'
          ? '<span class="page-gap">&hellip;</span>'
          : `<button class="page-btn${p === currentPage ? ' active' : ''}"
               onclick="goPage(${p})">${p}</button>`;
      });

      html += `
        <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''}
          onclick="goPage(${currentPage + 1})">Seterusnya &rsaquo;</button>
      `;

      box.innerHTML = html;
    }

    function goPage(n) {
      currentPage = n;
      renderPosts();

      const atas = document.querySelector('.section-heading');
      if (atas) atas.scrollIntoView({ behavior: 'smooth' });
    }

    function cariArtikel() {
      currentPage = 1;
      renderPosts();
    }

    function filterCategory(id) {
      activeCategory = id;
      currentPage = 1;
      renderPosts();
      updateCategoryButtons();
    }

    function updateCategoryButtons() {
      document.querySelectorAll('.category-btn').forEach(function(button) {
        button.classList.remove('active');

        const value = button.getAttribute('onclick') || '';
        if (
          (activeCategory === '' && value.includes("filterCategory('')")) ||
          (activeCategory !== '' &&
            value.includes("filterCategory('" + activeCategory + "')"))
        ) {
          button.classList.add('active');
        }
      });
    }

    function openPost(slug) {
      if (!slug) return;

      currentView = 'article';
      document.getElementById('mainContent').innerHTML =
        '<div class="loading">Sedang membuka artikel...</div>';

      window.scrollTo({ top: 0, behavior: 'smooth' });

      google.script.run
        .withSuccessHandler(function(post) {
          renderArticle(post, slug);
        })
        .withFailureHandler(function(error) {
          document.getElementById('mainContent').innerHTML = `
            <div class="empty-state">
              ${escapeHtml(error.message || String(error))}
              <br><br>
              <button class="back-btn" onclick="showHome()">
                KEMBALI KE LAMAN UTAMA
              </button>
            </div>
          `;
        })
        .getPublicPostBySlug(slug);
    }

    function renderArticle(post, slug) {
      const image = post.imej
        ? `<img class="article-image"
             src="${escapeAttr(post.imej)}"
             alt="${escapeAttr(post.tajuk)}"
             onerror="this.style.display='none'">`
        : '';

      document.getElementById('mainContent').innerHTML = `
        <article class="article-page">
          <button class="back-btn" onclick="showHome()">
            ← KEMBALI KE ARTIKEL
          </button>

          <div class="article-category">
            ${escapeHtml(post.kategori)}
          </div>

          <h1 class="article-title">
            ${escapeHtml(post.tajuk)}
          </h1>

          <div class="article-meta">
            ${escapeHtml(post.tarikh)}${post.penulis
              ? ' &nbsp; | &nbsp; ' + escapeHtml(post.penulis)
              : ''}
            &nbsp; | &nbsp; 💬 <span id="metaKomen">0</span> komen
          </div>

          ${image}

          <div class="article-body">${escapeHtml(post.kandungan)}</div>

          <section class="comment-section">
            <h3>Komen (<span id="cCount">0</span>)</h3>

            <div class="comment-form">
              <input id="cNama" type="text" maxlength="50"
                placeholder="Nama anda">
              <input id="cWeb" class="honeypot" type="text"
                tabindex="-1" autocomplete="off">
              <textarea id="cKomen" maxlength="1000"
                placeholder="Tulis komen anda..."></textarea>
              <button class="comment-submit" id="cBtn"
                onclick="submitComment('${escapeAttr(post.id)}')">
                HANTAR KOMEN
              </button>
              <div id="cMsg" class="comment-msg"></div>
            </div>

            <div id="commentList">
              <div class="loading">Memuatkan komen...</div>
            </div>
          </section>
        </article>
      `;

      loadComments(post.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadComments(idPost) {
      google.script.run
        .withSuccessHandler(function(list) {
          const box = document.getElementById('commentList');
          if (!box) return;

          // kemas kini jumlah komen (tajuk, meta artikel, dan kad di laman utama)
          const total = list ? list.length : 0;
          const metaKomen = document.getElementById('metaKomen');
          const cCount = document.getElementById('cCount');
          if (metaKomen) metaKomen.textContent = total;
          if (cCount) cCount.textContent = total;
          (portalData.artikel || []).forEach(function(p) {
            if (p.id === idPost) p.komen = total;
          });

          if (!list || !list.length) {
            box.innerHTML =
              '<div class="empty-state">Belum ada komen. Jadilah yang pertama!</div>';
            return;
          }

          box.innerHTML = list.map(function(c) {
            return `
              <div class="comment-item">
                <div class="comment-head">
                  <strong>${escapeHtml(c.nama)}</strong>
                  <span>${escapeHtml(c.tarikh)}</span>
                </div>
                <div class="comment-text">${escapeHtml(c.komen)}</div>
              </div>
            `;
          }).join('');
        })
        .withFailureHandler(function() {
          const box = document.getElementById('commentList');
          if (box) {
            box.innerHTML =
              '<div class="empty-state">Gagal memuatkan komen.</div>';
          }
        })
        .getPublicComments(idPost);
    }

    function submitComment(idPost) {
      const nama = document.getElementById('cNama').value;
      const kandungan = document.getElementById('cKomen').value;
      const web = document.getElementById('cWeb').value;
      const msg = document.getElementById('cMsg');
      const btn = document.getElementById('cBtn');

      if (web) return; // bot terperangkap honeypot

      btn.disabled = true;
      msg.className = 'comment-msg';
      msg.textContent = 'Menghantar...';

      google.script.run
        .withSuccessHandler(function(res) {
          msg.textContent = res.message;
          document.getElementById('cKomen').value = '';
          btn.disabled = false;
          if (res.approved) {
            loadComments(idPost);
            // kemas kini kiraan komen pada kad (tanpa muat semula portal)
            (portalData.artikel || []).forEach(function(p) {
              if (p.id === idPost) p.komen = Number(p.komen || 0) + 1;
            });
          }
        })
        .withFailureHandler(function(error) {
          msg.className = 'comment-msg error';
          msg.textContent = error.message || String(error);
          btn.disabled = false;
        })
        .tambahKomenPublic({
          idPost: idPost,
          nama: nama,
          kandungan: kandungan
        });
    }

    const voteBusy = {};
    const voteMemory = {};

    function getMyVote(id) {
      if (id in voteMemory) return voteMemory[id];
      try {
        return localStorage.getItem('undi_' + id) || '';
      } catch (e) {
        return '';
      }
    }

    function setMyVote(id, value) {
      voteMemory[id] = value;
      try {
        if (value) localStorage.setItem('undi_' + id, value);
        else localStorage.removeItem('undi_' + id);
      } catch (e) {}
    }

    function updateVoteUI(post) {
      const lk = document.getElementById('lk-' + post.id);
      const dl = document.getElementById('dl-' + post.id);
      const bl = document.getElementById('vb-like-' + post.id);
      const bd = document.getElementById('vb-dislike-' + post.id);
      const mine = getMyVote(post.id);

      if (lk) lk.textContent = Number(post.like || 0);
      if (dl) dl.textContent = Number(post.dislike || 0);
      if (bl) bl.classList.toggle('active', mine === 'like');
      if (bd) bd.classList.toggle('active', mine === 'dislike');
    }

    function vote(event, idPost, jenis) {
      event.stopPropagation();
      if (voteBusy[idPost]) return;

      const post = (portalData.artikel || []).find(function(p) {
        return p.id === idPost;
      });
      if (!post) return;

      const sebelum = getMyVote(idPost);
      const baru = sebelum === jenis ? '' : jenis; // klik semula = batal undi

      const asal = { like: post.like || 0, dislike: post.dislike || 0 };

      if (sebelum) post[sebelum] = Math.max(0, (post[sebelum] || 0) - 1);
      if (baru) post[baru] = (post[baru] || 0) + 1;

      setMyVote(idPost, baru);
      updateVoteUI(post);

      voteBusy[idPost] = true;

      google.script.run
        .withSuccessHandler(function(res) {
          voteBusy[idPost] = false;
          post.like = res.like;
          post.dislike = res.dislike;
          updateVoteUI(post);
        })
        .withFailureHandler(function() {
          voteBusy[idPost] = false;
          post.like = asal.like;
          post.dislike = asal.dislike;
          setMyVote(idPost, sebelum);
          updateVoteUI(post);
        })
        .undiPost(idPost, baru, sebelum);
    }

    function showHome() {
      activeCategory = '';
      currentPage = 1;
      renderHome();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>

</body>
</html>
